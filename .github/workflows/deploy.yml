name: Deploy to Production Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask==2.3.0 pandas==1.5.0 numpy==1.21.0 requests==2.28.0
    
    - name: Run basic syntax check
      run: |
        python -m py_compile app.py
        echo "Basic syntax check completed"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Production Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT }}
        script: |
          echo "🚀 Starting deployment to production server..."
          
          # 프로젝트 디렉토리로 이동
          cd /home/ubuntu/stock_analysis
          
          # Git에서 최신 변경사항 가져오기
          echo "📥 Pulling latest changes from GitHub..."
          git fetch origin
          git reset --hard origin/main
          
          # Python 의존성 업데이트 (미리 컴파일된 바이너리 사용)
          echo "📦 Installing essential Python dependencies..."
          pip install --user --no-build-isolation --prefer-binary flask==2.3.0 requests==2.28.0 APScheduler==3.10.0
          
          # NumPy와 Pandas는 서버에 이미 설치되어 있으므로 스킵
          echo "📦 Skipping NumPy and Pandas (already installed on server)"
          
          # MySQL 패키지는 별도로 설치 (버전 호환성)
          echo "📦 Installing MySQL connector..."
          pip install --user mysql-connector-python || echo "MySQL connector installation failed, continuing..."
          
          # 기존 프로세스 종료 (graceful shutdown)
          echo "🛑 Stopping existing application..."
          pkill -f "python.*app.py" || echo "No existing process found"
          sleep 5
          
          # 백그라운드에서 새 애플리케이션 시작 (더 안전하게)
          echo "🚀 Starting new application..."
          cd /home/ubuntu/stock_analysis
          source venv/bin/activate
          nohup python app.py > app.log 2>&1 &
          
          # 프로세스 시작 확인 (더 짧은 대기)
          sleep 5
          if pgrep -f "python.*app.py" > /dev/null; then
            echo "✅ Application started successfully"
            echo "🌐 Server is running on http://${{ secrets.PRODUCTION_HOST }}:5000"
          else
            echo "❌ Failed to start application"
            echo "📋 Last 10 lines of log:"
            tail -10 app.log || echo "No log file found"
            echo "Will continue anyway - manual check required"
          fi
          
          echo "🎉 Deployment completed successfully!"

    - name: Notify Deployment Status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ 배포가 성공적으로 완료되었습니다!"
          echo "🌐 웹서버 주소: http://${{ secrets.PRODUCTION_HOST }}:5000"
        else
          echo "❌ 배포 중 오류가 발생했습니다."
        fi
